[project]
name = "brineview"
version = "0.2.0"
description = "Web-Based Interactive 3D Ocean Data Visualization Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "xarray>=2024.1",
  "numpy>=1.26",
  "netCDF4>=1.7",
  "h5netcdf>=1.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "python build_vercel.py"
