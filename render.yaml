services:
  - type: web
    name: brineview
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /
    envVars:
      - key: BRINEVIEW_ADAPTER
        value: synthetic
      - key: JWT_SECRET
        generateValue: true